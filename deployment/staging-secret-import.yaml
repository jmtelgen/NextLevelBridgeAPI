AWSTemplateFormatVersion: "2010-09-09"
Description: >-
  REVIEW ONLY - import the existing bridge-staging JWT secret without creating
  signing material. Use only a separately reviewed IMPORT operation.
Metadata:
  StagingTarget:
    AccountId: "851725597758"
    Region: us-west-2
    ReviewOnly: true

Resources:
  JwtSigningSecret:
    Type: AWS::SecretsManager::Secret
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      Name: bridge-staging-jwt
      Description: Independent staging-only HS256 signing material; never output the value.
      GenerateSecretString:
        SecretStringTemplate: "{}"
        GenerateStringKey: jwt_secret
        PasswordLength: 64
        ExcludePunctuation: true

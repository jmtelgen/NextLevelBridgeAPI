name: Backend CI (not deployment)

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend:
    name: Selected backend (${{ matrix.suite }})
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        suite: [core, native]
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      AWS_EC2_METADATA_DISABLED: "true"
      AWS_ACCESS_KEY_ID: testing
      AWS_SECRET_ACCESS_KEY: testing
      AWS_DEFAULT_REGION: us-east-1
      AWS_REGION: us-east-1
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-ci.txt
      - name: Install pinned CI dependencies
        run: python -m pip install --requirement requirements-ci.txt
      - name: Run bounded offline suite
        run: python -B .github/scripts/test_backend.py "${{ matrix.suite }}"
      - name: Describe coverage boundary
        if: always()
        run: |
          {
            echo '## Backend CI coverage'
            echo 'Explicit selected tests only; AWS SDK network transport is blocked.'
            echo 'Core excludes native DDS; the native gate tests the tracked Linux x86_64 binary.'
            echo 'Loopback transport tests, legacy suites, and Lambda ABI/deployment are NOT validated.'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload source only (not a Lambda package)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && matrix.suite == 'core'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: backend-source-NOT-LAMBDA-${{ github.sha }}
          path: |
            lambdas/**/*.py
            scripts/*.py
            requirements*.txt
          if-no-files-found: error
          retention-days: 7

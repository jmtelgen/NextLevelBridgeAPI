name: Package and plan staging application (NO execution)
on:
  workflow_dispatch:
    inputs:
      change_set_type:
        description: CREATE for the first application stack; UPDATE for later code releases
        required: true
        type: choice
        options: [CREATE, UPDATE]
permissions: {}
concurrency:
  group: staging-application-release
  cancel-in-progress: false
jobs:
  package:
    if: github.repository == 'jmtelgen/NextLevelBridgeAPI' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      AWS_EC2_METADATA_DISABLED: "true"
      AWS_SHARED_CREDENTIALS_FILE: /dev/null
      AWS_CONFIG_FILE: /dev/null
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build target-validated immutable Lambda package before requesting AWS credentials
        run: bash deployment/package/build_staging.sh build/staging-package
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: lambda-staging-release-${{ github.sha }}
          path: build/staging-package/bridge-staging-*
          if-no-files-found: error
          retention-days: 7
  plan:
    needs: package
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: staging
    permissions:
      contents: read
      id-token: write
    env:
      AWS_ACCOUNT_ID: ${{ vars.AWS_ACCOUNT_ID }}
      AWS_REGION: ${{ vars.AWS_REGION }}
      AWS_APPLICATION_PLAN_ROLE_ARN: ${{ vars.AWS_APPLICATION_PLAN_ROLE_ARN }}
      STAGING_PLATFORM_STACK: ${{ vars.STAGING_PLATFORM_STACK || 'bridge-staging-platform' }}
      APPLICATION_CHANGE_SET_TYPE: ${{ inputs.change_set_type }}
      PYTHONDONTWRITEBYTECODE: "1"
      AWS_EC2_METADATA_DISABLED: "true"
      AWS_SHARED_CREDENTIALS_FILE: /dev/null
      AWS_CONFIG_FILE: /dev/null
      AWS_PAGER: ""
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: lambda-staging-release-${{ github.sha }}
          path: build/staging-package
      - name: Verify target and native receipt before OIDC
        run: python3 -B .github/scripts/plan_staging_application.py validate build/staging-package
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_APPLICATION_PLAN_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          allowed-account-ids: ${{ vars.AWS_ACCOUNT_ID }}
          role-session-name: BridgeApplicationPlan-${{ github.run_id }}-${{ github.run_attempt }}
          role-duration-seconds: 900
          retry-max-attempts: 2
          unset-current-credentials: true
          output-credentials: false
      - name: Publish versioned artifact and prepare human-reviewed change set
        run: python3 -B .github/scripts/plan_staging_application.py plan build/staging-package

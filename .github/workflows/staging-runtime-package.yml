name: Validate Lambda staging package (NO deployment)
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  target:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      AWS_EC2_METADATA_DISABLED: "true"
      AWS_SHARED_CREDENTIALS_FILE: /dev/null
      AWS_CONFIG_FILE: /dev/null
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Test packaging contracts without AWS credentials
        run: python3 -B deployment/package/test_packaging.py
      - name: Build and solve in the pinned AL2023 Python 3.12 x86_64 target
        run: bash deployment/package/build_staging.sh build/staging-package
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: lambda-staging-validated-${{ github.sha }}
          path: build/staging-package/bridge-staging-*
          if-no-files-found: error
          retention-days: 7
